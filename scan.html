<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFC Scan | Build a Viking</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; }
    main { max-width: 460px; }
    p { line-height: 1.6; }
  </style>
  <script src="channel.js" defer></script>
  <script src="scan.js" defer></script>
</head>
<body>
  <main>
    <h1 id="scan-title">NFC tag scanned</h1>
    <p id="scan-status" role="status">Sending scan to the Viking display…</p>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
</body>
</html>
