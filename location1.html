<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s ease;
    }
    body.state-glow {
      background: #d3d3d3;
    }
    #location-line {
      font-size: 2rem;
      font-weight: 600;
      color: #1d4ed8;
      transition: color 0.2s ease;
    }
    body.state-tapped #location-line {
      color: #60a5fa;
    }
  </style>
</head>
<body onclick="activatePanel()">
  <div id="location-line">Location 1</div>

  <script>
    const CHANNEL = "jelling-snake-hackathon-2026";
    const params = new URLSearchParams(window.location.search);
    const isRemote = params.get("remote") === "1";

    if (!isRemote) {
      fetch(`https://ntfy.sh/${CHANNEL}`, { method: "POST", body: "UNLOCK_1" }).catch(() => {});
    }

    function setGlowState(isNear) {
      document.body.classList.toggle("state-glow", Boolean(isNear));
    }

    function activatePanel() {
      document.body.classList.add("state-tapped");
    }

    function resetToSleep() {
      document.body.classList.remove("state-glow", "state-tapped");
    }

    const eventSource = new EventSource(`https://ntfy.sh/${CHANNEL}/sse`);
    eventSource.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        const command = (data.message || "").trim();

        if (command === "GLOW_ON") setGlowState(true);
        else if (command === "GLOW_OFF") setGlowState(false);
        else if (command === "UNLOCK_1") activatePanel();
        else if (command === "UNLOCK_2") window.location.href = "location2.html?location=2&remote=1";
        else if (command === "UNLOCK_3") window.location.href = "location3.html?location=3&remote=1";
      } catch (e) {}
    };

    window.setGlowState = setGlowState;
    window.activatePanel = activatePanel;
    window.resetToSleep = resetToSleep;
  </script>
</body>
</html>
