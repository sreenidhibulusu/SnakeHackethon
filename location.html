<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Display | Jelling Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16; color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px; overflow: hidden;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    body.state-sleep #panel-view { display: none; }
    body.state-sleep #stone-view { display: flex; opacity: 0.4; }

    body.state-glow {
      background: #131c31;
      box-shadow: inset 0 0 80px #f59e0b;
    }
    body.state-glow #panel-view { display: none; }
    body.state-glow #stone-view {
      display: flex; opacity: 1;
      animation: pulseGlow 1s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(0.96); filter: drop-shadow(0 0 10px #f59e0b); }
      to { transform: scale(1.05); filter: drop-shadow(0 0 35px #f59e0b); }
    }

    body.state-active #stone-view { display: none; }
    body.state-active #panel-view {
      display: flex; flex-direction: column; align-items: center;
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #stone-view {
      flex-direction: column; align-items: center; cursor: pointer;
    }
    .rune-symbol { font-size: 5rem; color: #f59e0b; margin-bottom: 16px; }

    .snake-container {
      width: 220px; height: 220px; border-radius: 50%;
      border: 3px solid #f59e0b; overflow: hidden;
      margin-bottom: 20px; display: flex;
      align-items: center; justify-content: center;
      background: #000; box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
    }

    .panel-card {
      max-width: 420px; background: rgba(30, 41, 59, 0.9);
      border: 1px solid #f59e0b; border-radius: 16px; padding: 20px;
    }
    .panel-title { color: #f59e0b; font-size: 1.4rem; margin-bottom: 10px; }
    .panel-story { font-size: 1rem; line-height: 1.5; margin-bottom: 14px; }
    .direction-box {
      background: rgba(245, 158, 11, 0.15); border-left: 4px solid #f59e0b;
      padding: 10px; font-size: 0.95rem; text-align: left; border-radius: 6px;
    }
    .reset-btn {
      margin-top: 14px; padding: 8px 16px; background: transparent;
      border: 1px solid #94a3b8; color: #cbd5e1; border-radius: 6px;
      cursor: pointer;
    }
    #camera-controls { position: fixed; bottom: 16px; left: 16px; right: 16px; font-size: 0.85rem; color: #94a3b8; }
    #camera-controls button { padding: 8px 16px; margin-bottom: 6px; cursor: pointer; }
  </style>
</head>
<body class="state-sleep">

  <div id="stone-view" onclick="activatePanel()">
    <div class="rune-symbol">ᚼᛒ</div>
    <h2 id="stone-status" aria-live="polite">Waiting for NFC scan</h2>
    <p id="stone-sub" style="margin-top:8px; color:#94a3b8;">
      Scan this location’s NFC tag to awaken the runestone
    </p>
  </div>

  <div id="panel-view">
    <div class="snake-container">
      <span role="img" aria-label="Serpent" style="font-size:4rem">🐍</span>
    </div>

    <div class="panel-card">
      <h1 class="panel-title" id="station-title"></h1>
      <p class="panel-story" id="station-story"></p>
      <div class="direction-box" id="station-direction"></div>
      <button class="reset-btn" onclick="resetToSleep()">Put Stone to Sleep</button>
    </div>
  </div>

  <div id="camera-controls">
    <button id="camera-toggle" type="button">Enable camera</button>
    <p id="camera-status" role="status">Camera off</p>
    <video id="presence-camera" autoplay muted playsinline hidden></video>
  </div>

  <script src="channel.js"></script>
  <script src="display.js"></script>
  <script src="presence.js"></script>
</body>
</html>
