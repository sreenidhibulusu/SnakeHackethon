<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Display | Jelling Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- loaded without blocking, so the page still works if the internet is slow or down -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16; color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px; overflow: hidden;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    /* per-location museum photo, darkened so the text stays readable */
    html[data-pair="1"] { --pair-bg: url("picture/backgrounds/pair1-seasons.jpg"); }
    html[data-pair="2"] { --pair-bg: url("picture/backgrounds/pair2-burial.jpg"); }
    html[data-pair="3"] { --pair-bg: url("picture/backgrounds/pair3-mentors.png"); }

    html[data-pair="1"] body::before,
    html[data-pair="2"] body::before,
    html[data-pair="3"] body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(rgba(9, 13, 22, 0.55), rgba(9, 13, 22, 0.75)),
        var(--pair-bg) center / cover no-repeat;
    }

    body.state-sleep #panel-view { display: none; }
    body.state-sleep #stone-view { display: flex; opacity: 0.4; }

    body.state-glow {
      background: #131c31;
      box-shadow: inset 0 0 80px #f59e0b;
    }
    body.state-glow #panel-view { display: none; }
    body.state-glow #stone-view {
      display: flex; opacity: 1;
      animation: pulseGlow 1s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(0.96); filter: drop-shadow(0 0 10px #f59e0b); }
      to { transform: scale(1.05); filter: drop-shadow(0 0 35px #f59e0b); }
    }

    body.state-active #stone-view { display: none; }
    body.state-active #panel-view {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 560px;
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #stone-view {
      flex-direction: column; align-items: center; cursor: pointer;
    }
    .rune-symbol { font-size: 5rem; color: #f59e0b; margin-bottom: 16px; }

    .mcq-question {
      width: 100%;
      background: rgba(220, 220, 220, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #f5ecd8;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.35;
      padding: 48px 28px;
      border-radius: 36px;
      margin-bottom: 44px;
      text-align: center;
    }

    .mcq-options {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .mcq-btn {
      width: 100%;
      padding: 20px 14px;
      border-radius: 28px;
      border: 2px solid transparent;
      background: #dcdcdc;
      color: #090d16;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .mcq-btn:hover {
      transform: scale(1.02);
      background: #f1f5f9;
    }

    .mcq-btn.selected {
      background: #f59e0b;
      color: #090d16;
      border-color: #fde68a;
    }

    .mcq-btn.has-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px 12px 16px;
    }

    .mcq-badge {
      flex: none;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fffaf0, #e8dcc4);
      border: 2px solid #8a6a3f;
      box-shadow: inset 0 0 0 3px #f5ecd8, 0 2px 6px rgba(0, 0, 0, 0.25);
      display: grid;
      place-items: center;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .mcq-badge img {
      width: 92%;
      height: 92%;
      object-fit: contain;
      transform: rotate(-8deg);
      transition: transform 0.25s ease;
    }

    .mcq-btn.has-icon:hover .mcq-badge img {
      transform: rotate(8deg) scale(1.08);
    }

    .mcq-btn.selected .mcq-badge {
      border-color: #090d16;
      box-shadow: inset 0 0 0 3px #fde68a, 0 0 14px #fde68a;
    }

    .mcq-btn.selected .mcq-badge img {
      animation: brandish 0.6s ease;
    }

    @keyframes brandish {
      0% { transform: rotate(-8deg) scale(1); }
      30% { transform: rotate(-30deg) scale(1.15); }
      60% { transform: rotate(18deg) scale(1.15); }
      100% { transform: rotate(-8deg) scale(1); }
    }

    .mcq-options[hidden],
    .viking-model[hidden] { display: none; }

    .viking-model {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.5s ease forwards;
    }

    .vm-stage {
      position: relative;
      height: 46vh;
      max-width: 100%;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.5));
    }

    .vm-stage img {
      position: absolute;
      height: auto;
    }

    .viking-summary {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #fde68a;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .viking-hint {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .change-btn {
      margin-top: 4px;
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #f5ecd8;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .change-btn:hover { background: rgba(255, 255, 255, 0.18); }

    .proceed-msg {
      margin-top: 28px;
      color: #f59e0b;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="state-sleep">

  <div id="stone-view" onclick="showState('active')">
    <div class="rune-symbol">ᚼᛒ</div>
    <h2 id="stone-status" aria-live="polite">Waiting for NFC scan</h2>
    <p id="stone-sub" style="margin-top:8px; color:#94a3b8;">
      Scan this location’s NFC tag to awaken the runestone
    </p>
  </div>

  <div id="panel-view">
    <div class="mcq-question" id="mcq-question"></div>
    <div class="mcq-options" id="mcq-options"></div>
    <div class="viking-model" id="viking-model" hidden>
      <div class="viking-art" id="viking-art"></div>
      <p class="viking-summary" id="viking-summary"></p>
      <p class="viking-hint" id="viking-hint"></p>
      <button class="change-btn" id="change-answer" type="button">Change answer</button>
    </div>
    <div class="proceed-msg" id="proceed-msg" hidden>Proceed next</div>
  </div>

  <script src="channel.js"></script>
  <script src="viking-model.js"></script>
  <script>document.documentElement.dataset.pair = window.jellingPair;</script>
  <script src="display.js"></script>
</body>
</html>
