<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Display | Jelling Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16; color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px; overflow-x: hidden;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    body.state-sleep #panel-view { display: none; }
    body.state-sleep #stone-view { display: flex; opacity: 0.4; }

    body.state-glow {
      background: #131c31;
      box-shadow: inset 0 0 80px #f59e0b;
    }
    body.state-glow #panel-view { display: none; }
    body.state-glow #stone-view {
      display: flex; opacity: 1;
      animation: pulseGlow 1s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(0.96); filter: drop-shadow(0 0 10px #f59e0b); }
      to { transform: scale(1.05); filter: drop-shadow(0 0 35px #f59e0b); }
    }

    body.state-active #stone-view { display: none; }
    body.state-active #panel-view {
      display: flex; flex-direction: column; align-items: center;
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #stone-view {
      flex-direction: column; align-items: center; cursor: pointer;
    }
    .rune-symbol { font-size: 5rem; color: #f59e0b; margin-bottom: 16px; }

    .snake-container {
      width: 160px; height: 160px; border-radius: 50%;
      border: 3px solid #f59e0b; overflow: hidden;
      margin-bottom: 16px; display: flex;
      align-items: center; justify-content: center;
      background: #000; box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
    }

    .panel-card {
      max-width: 480px; width: 100%; background: rgba(30, 41, 59, 0.92);
      border: 1px solid #f59e0b; border-radius: 16px; padding: 20px;
    }
    .token-pill {
      display: inline-block; padding: 4px 12px; margin-bottom: 10px;
      border-radius: 999px; font-size: 0.82rem; font-weight: 600;
      background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #f59e0b;
    }
    .panel-title { color: #f59e0b; font-size: 1.35rem; margin-bottom: 8px; }
    .panel-story { font-size: 0.96rem; line-height: 1.5; margin-bottom: 14px; color: #e2e8f0; }

    .mcq-section {
      margin: 14px 0; padding: 14px; border-radius: 10px;
      background: rgba(15, 23, 42, 0.75); border: 1px solid #334155;
      text-align: left;
    }
    .mcq-question {
      font-size: 0.95rem; font-weight: 600; color: #f8fafc; margin-bottom: 10px;
    }
    .mcq-options {
      display: flex; flex-direction: column; gap: 8px;
    }
    .mcq-btn {
      width: 100%; text-align: left; padding: 10px 12px;
      border-radius: 8px; border: 1px solid #475569;
      background: #1e293b; color: #f1f5f9; font-size: 0.9rem;
      cursor: pointer; transition: all 0.15s ease;
    }
    .mcq-btn:hover {
      border-color: #f59e0b; background: rgba(245, 158, 11, 0.12);
    }
    .mcq-btn.selected-correct {
      border-color: #22c55e; background: rgba(34, 197, 94, 0.2); color: #86efac;
    }
    .mcq-btn.selected-wrong {
      border-color: #ef4444; background: rgba(239, 68, 68, 0.2); color: #fca5a5;
    }
    .mcq-feedback {
      margin-top: 8px; font-size: 0.88rem; min-height: 1.2em;
    }

    .summary-box {
      margin: 12px 0; padding: 12px; border-radius: 8px;
      background: rgba(15, 23, 42, 0.6); border: 1px dashed #64748b;
      text-align: left; font-size: 0.86rem; color: #cbd5e1;
    }
    .summary-title {
      color: #f59e0b; font-weight: 600; margin-bottom: 6px;
    }
    .summary-list {
      list-style: none; display: flex; flex-direction: column; gap: 4px;
    }

    .direction-box {
      background: rgba(245, 158, 11, 0.15); border-left: 4px solid #f59e0b;
      padding: 10px; font-size: 0.92rem; text-align: left; border-radius: 6px;
    }
    .reset-btn {
      margin-top: 14px; padding: 8px 16px; background: transparent;
      border: 1px solid #94a3b8; color: #cbd5e1; border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body class="state-sleep">

  <div id="stone-view" onclick="activatePanel()">
    <div class="rune-symbol">ᚼᛒ</div>
    <h2 id="stone-status" aria-live="polite">Waiting for NFC scan</h2>
    <p id="stone-sub" style="margin-top:8px; color:#94a3b8;">
      Scan this location’s NFC tag to awaken the runestone
    </p>
  </div>

  <div id="panel-view">
    <div class="snake-container">
      <span role="img" aria-label="Serpent" style="font-size:4rem">🐍</span>
    </div>

    <div class="panel-card">
      <div class="token-pill" id="active-token-badge">Serpent Token: token1</div>
      <h1 class="panel-title" id="station-title"></h1>
      <p class="panel-story" id="station-story"></p>

      <div class="mcq-section" id="mcq-section">
        <div class="mcq-question" id="mcq-question"></div>
        <div class="mcq-options" id="mcq-options"></div>
        <div class="mcq-feedback" id="mcq-feedback"></div>
      </div>

      <div class="summary-box" id="summary-box">
        <div class="summary-title" id="summary-title">Visitor Answers Stored</div>
        <ul class="summary-list" id="summary-list"></ul>
      </div>

      <div class="direction-box" id="station-direction"></div>
      <button class="reset-btn" onclick="resetToSleep()">Put Stone to Sleep</button>
    </div>
  </div>

  <script src="channel.js"></script>
  <script src="display.js"></script>
</body>
</html>
