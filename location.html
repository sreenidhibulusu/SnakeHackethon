<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Display | Jelling Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/location.css">
</head>
<body class="state-sleep">

  <div id="stone-view" onclick="showState('active')">
    <div class="rune-symbol">ᚼᛒ</div>
    <h2 id="stone-status" aria-live="polite">Waiting for NFC scan</h2>
    <p id="stone-sub" style="margin-top:8px; color:#94a3b8;">
      Scan this location’s NFC tag to awaken the runestone
    </p>
  </div>

  <div id="panel-view">
    <div class="mcq-question" id="mcq-question"></div>
    <div class="mcq-options" id="mcq-options"></div>
    <div class="proceed-msg" id="proceed-msg" hidden>Proceed next</div>
  </div>

  <video id="webcam" autoplay playsinline muted aria-hidden="true"></video>

  <script src="js/channel.js"></script>
  <script>document.documentElement.dataset.pair = window.jellingPair;</script>
  <script src="js/display.js"></script>
  <script type="module" src="js/vision.js"></script>
</body>
</html>
