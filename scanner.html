<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Sensor & NFC Scanner</title>
</head>
<body style="background:#111; color:#0f0; font-family:sans-serif; text-align:center; padding:20px;">
  <h2>Phone Sensor Active</h2>
  <p id="status">Waiting for visitor...</p>
  <video id="webcam" autoplay playsinline muted style="width:100%; max-width:300px; border-radius:12px;"></video>

  <script type="module">
    import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    // Change this to any unique secret channel name for your team!
    const CHANNEL = "jelling-snake-hackathon-2026";
    const video = document.getElementById("webcam");
    const statusText = document.getElementById("status");
    let detector;
    let lastVideoTime = -1;
    let isPersonClose = false;
    let lastSentState = false;

    async function startPhoneSensor() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      detector = await ObjectDetector.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
          delegate: "GPU"
        },
        scoreThreshold: 0.5,
        runningMode: "VIDEO",
        categoryAllowlist: ["person"]
      });

      // Use front camera ("user") or back camera ("environment")
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 640, height: 480 }
      });
      video.srcObject = stream;
      video.addEventListener("loadeddata", detectLoop);
    }

    function detectLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = detector.detectForVideo(video, performance.now());

        // Check if person fills at least 30% of the camera frame
        isPersonClose = results.detections.some(
          d => (d.boundingBox.width / video.videoWidth) >= 0.30
        );

        // Only send network message when state changes (prevents spam)
        if (isPersonClose !== lastSentState) {
          lastSentState = isPersonClose;
          const msg = isPersonClose ? "GLOW_ON" : "GLOW_OFF";
          statusText.innerText = isPersonClose ? "Visitor in proximity! (Glowing)" : "Waiting for visitor...";
          fetch(`https://ntfy.sh/${CHANNEL}`, { method: "POST", body: msg });
        }
      }
      requestAnimationFrame(detectLoop);
    }

    // OPTIONAL: If using Android Chrome, scan NFC directly on this page too
    if ("NDEFReader" in window) {
      const ndef = new NDEFReader();
      document.body.addEventListener("click", async () => {
        await ndef.scan();
        ndef.onreading = async (event) => {
          let locationId;
          for (const record of event.message.records) {
            if (!["url", "text"].includes(record.recordType)) continue;
            const value = new TextDecoder(record.encoding || "utf-8").decode(record.data).trim();
            if (/^[123]$/.test(value)) {
              locationId = value;
              break;
            }
            try {
              const url = new URL(value, window.location.href);
              const candidate = url.searchParams.get("location") || url.searchParams.get("loc")
                || url.pathname.match(/\/location([123])\.html$/)?.[1];
              if (["1", "2", "3"].includes(candidate)) {
                locationId = candidate;
                break;
              }
            } catch {}
          }
          if (!locationId) {
            statusText.innerText = "Tag has no valid location (1, 2 or 3).";
            return;
          }
          try {
            const response = await fetch(`https://ntfy.sh/${CHANNEL}`, {
              method: "POST", body: `UNLOCK_${locationId}`
            });
            if (!response.ok) throw new Error("Scan could not be sent");
            statusText.innerText = `Location ${locationId} scanned!`;
          } catch {
            statusText.innerText = "Could not send scan. Please scan again.";
          }
        };
      }, { once: true });
    }

    startPhoneSensor();
  </script>
</body>
</html>
