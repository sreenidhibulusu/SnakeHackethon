<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Viking | Build a Viking</title>
    <link rel="stylesheet" href="style.css">
    <script src="character.js" defer></script>
    <script src="storage.js?v=station-views-5" defer></script>
    <script src="app.js?v=station-views-5" defer></script>
    <script src="channel.js?v=station-views-5" defer></script>
    <script src="display.js?v=station-views-5" defer></script>
</head>

<body data-page="result">
    <main>
        <p class="step">Result station</p>
        <h1>Your Viking</h1>
        <p id="scan-connection" role="status">Connecting to NFC scans…</p>
        <div class="builder" hidden>
            <section id="viking-view" class="preview" aria-label="Your accumulated Viking" tabindex="-1" hidden>
                <div id="character-art"></div>
                <h2 id="preview-name"></h2>
                <p id="preview-latin-name"></p>
                <p id="token-label"></p>
                <p id="result-summary"></p>
                <p id="save-status" role="status"></p>
                <button id="done" type="button">Done</button>
            </section>
        </div>
    </main>
</body>

</html>
