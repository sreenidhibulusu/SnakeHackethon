<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake-Techathon | Jelling Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16; color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px; overflow: hidden;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    body.state-sleep #stone-view { display: flex; opacity: 0.4; }

    body.state-glow {
      background: #131c31;
      box-shadow: inset 0 0 80px #f59e0b;
    }
    body.state-glow #stone-view {
      display: flex; opacity: 1;
      animation: pulseGlow 1s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(0.96); filter: drop-shadow(0 0 10px #f59e0b); }
      to { transform: scale(1.05); filter: drop-shadow(0 0 35px #f59e0b); }
    }

    #stone-view {
      flex-direction: column; align-items: center; cursor: pointer;
    }
    .rune-symbol { font-size: 5rem; color: #f59e0b; margin-bottom: 16px; }
  </style>
</head>
<body class="state-sleep">

  <div id="stone-view" onclick="activatePanel()">
    <div class="rune-symbol">ᚼᛒ</div>
    <h2 id="stone-status">Runestone Sleeping</h2>
    <p id="stone-sub" style="margin-top:8px; color:#94a3b8;">
      Step closer or tap your Norse Serpent to awaken
    </p>
  </div>

  <script>
    const CHANNEL = "jelling-snake-hackathon-2026";
    const LOCATION_PAGES = {
      "1": "location1.html?location=1",
      "2": "location2.html?location=2",
      "3": "location3.html?location=3"
    };

    const params = new URLSearchParams(window.location.search);
    const requestedLoc = params.get("location") || params.get("loc");
    const locId = requestedLoc || "1";

    if (requestedLoc && LOCATION_PAGES[requestedLoc]) {
      window.location.replace(LOCATION_PAGES[requestedLoc]);
    }

    function activatePanel() {
      window.location.href = LOCATION_PAGES[locId] || LOCATION_PAGES["1"];
    }

    function resetToSleep() {
      document.body.className = "state-sleep";
      document.getElementById("stone-status").textContent = "Runestone Sleeping";
    }

    window.setGlowState = function(isNear) {
      if (isNear) {
        document.body.className = "state-glow";
        document.getElementById("stone-status").textContent = "The Runestone Awakens!";
      } else {
        resetToSleep();
      }
    };

    const eventSource = new EventSource(`https://ntfy.sh/${CHANNEL}/sse`);
    eventSource.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        const command = (data.message || "").trim();

        if (command === "GLOW_ON") {
          window.setGlowState(true);
        } else if (command === "GLOW_OFF") {
          window.setGlowState(false);
        } else if (command === "UNLOCK_1") {
          window.location.href = `${LOCATION_PAGES["1"]}&remote=1`;
        } else if (command === "UNLOCK_2") {
          window.location.href = `${LOCATION_PAGES["2"]}&remote=1`;
        } else if (command === "UNLOCK_3") {
          window.location.href = `${LOCATION_PAGES["3"]}&remote=1`;
        }
      } catch (e) {}
    };

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "g") window.setGlowState(true);
      if (e.key === " ") activatePanel();
      if (["1", "2", "3"].includes(e.key)) {
        window.location.href = LOCATION_PAGES[e.key];
      }
    });
  </script>
</body>
</html>
