<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake-Techathon | Jelling Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16; color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px; overflow: hidden;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    /* STATE 1: SLEEPING RUNESTONE */
    body.state-sleep #panel-view { display: none; }
    body.state-sleep #stone-view { display: flex; opacity: 0.4; }

    /* STATE 2: GLOWING RUNESTONE (When visitor is near) */
    body.state-glow {
      background: #131c31;
      box-shadow: inset 0 0 80px #f59e0b;
    }
    body.state-glow #panel-view { display: none; }
    body.state-glow #stone-view {
      display: flex; opacity: 1;
      animation: pulseGlow 1s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(0.96); filter: drop-shadow(0 0 10px #f59e0b); }
      to { transform: scale(1.05); filter: drop-shadow(0 0 35px #f59e0b); }
    }

    /* STATE 3: ACTIVE MUSEUM PANEL & SNAKE ANIMATION */
    body.state-active #stone-view { display: none; }
    body.state-active #panel-view {
      display: flex; flex-direction: column; align-items: center;
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #stone-view {
      flex-direction: column; align-items: center; cursor: pointer;
    }
    .rune-symbol { font-size: 5rem; color: #f59e0b; margin-bottom: 16px; }

    /* Container for Lita's 3D Snake Render */
    .snake-container {
      width: 220px; height: 220px; border-radius: 50%;
      border: 3px solid #f59e0b; overflow: hidden;
      margin-bottom: 20px; display: flex;
      align-items: center; justify-content: center;
      background: #000; box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
    }
    .snake-container video, .snake-container img {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* Thomas & Manuela's Museum Panel Card */
    .panel-card {
      max-width: 420px; background: rgba(30, 41, 59, 0.9);
      border: 1px solid #f59e0b; border-radius: 16px; padding: 20px;
    }
    .panel-title { color: #f59e0b; font-size: 1.4rem; margin-bottom: 10px; }
    .panel-story { font-size: 1rem; line-height: 1.5; margin-bottom: 14px; }
    .direction-box {
      background: rgba(245, 158, 11, 0.15); border-left: 4px solid #f59e0b;
      padding: 10px; font-size: 0.95rem; text-align: left; border-radius: 6px;
    }
    .reset-btn {
      margin-top: 14px; padding: 8px 16px; background: transparent;
      border: 1px solid #94a3b8; color: #cbd5e1; border-radius: 6px;
      cursor: pointer;
    }
    .direction-box a {
      color: #f59e0b; text-decoration: underline;
    }
  </style>
</head>
<body class="state-sleep">

  <!-- SLEEPING / GLOWING RUNESTONE VIEW -->
  <div id="stone-view" onclick="activatePanel()">
    <div class="rune-symbol">ᚼᛒ</div>
    <h2 id="stone-status">Runestone Sleeping</h2>
    <p id="stone-sub" style="margin-top:8px; color:#94a3b8;">
      Step closer or tap your Norse Serpent to awaken
    </p>
  </div>

  <!-- ACTIVE SNAKE & MUSEUM PANEL VIEW -->
  <div id="panel-view">
    <div class="snake-container">
      <!-- Replace snake.mp4 with Lita's render file in the repo -->
      <video id="snake-vid" src="snake.mp4" autoplay loop muted playsinline
             onerror="this.outerHTML='<span style=\'font-size:4rem\'>🐍</span>'">
      </video>
    </div>

    <div class="panel-card">
      <h1 class="panel-title" id="p-title">Location Title</h1>
      <p class="panel-story" id="p-story">Story text goes here...</p>
      <div class="direction-box" id="p-direct">
        👉 <strong>Where to look next:</strong> Direction text...
      </div>
      <button class="reset-btn" onclick="resetToSleep()">Put Stone to Sleep</button>
    </div>
  </div>

  <script>
    const LOCATION_PAGES = {
      "1": "location1.html?location=1",
      "2": "location2.html?location=2",
      "3": "location3.html?location=3"
    };

    const params = new URLSearchParams(window.location.search);
    const requestedLoc = params.get("location") || params.get("loc");
    const locId = requestedLoc || "1";
    const autoTap = params.get("tap") === "1";

    // If opened with ?location=1, ?location=2, or ?location=3, route to that dedicated HTML page
    if (requestedLoc && LOCATION_PAGES[requestedLoc]) {
      window.location.replace(LOCATION_PAGES[requestedLoc]);
    }

    let isActive = false;
    let lastTapTime = 0;
    let inactivityTimer = null;

    // Tapping the Runestone on index.html opens the target location page
    function activatePanel() {
      const now = Date.now();
      if (isActive && (now - lastTapTime < 4000)) return;
      lastTapTime = now;
      window.location.href = LOCATION_PAGES[locId] || LOCATION_PAGES["1"];
    }

    function resetToSleep() {
      isActive = false;
      document.body.className = "state-sleep";
      document.getElementById("stone-status").textContent = "Runestone Sleeping";
    }

    // HOOK FOR JUAN'S PROXIMITY GLOW
    window.setGlowState = function(isNear) {
      if (isActive) return; // Don't interrupt active story
      if (isNear) {
        document.body.className = "state-glow";
        document.getElementById("stone-status").textContent = "The Runestone Awakens!";
      } else {
        resetToSleep();
      }
    };

    // If opened by NFC tap (?location=1&tap=1), start immediately
    if (autoTap) {
      activatePanel();
    }

    // Keyboard shortcuts for quick laptop testing (G = Glow, Space = Activate, 1/2/3 = Switch Location)
    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "g") window.setGlowState(true);
      if (e.key === " ") activatePanel();
      if (["1", "2", "3"].includes(e.key)) {
        window.location.href = LOCATION_PAGES[e.key];
      }
    });
  </script>
</body>
</html>
